
apiVersion: apps/v1
kind: Deployment
metadata:
  name: complete-web
  namespace: service-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: complete-web
  template:
    metadata:
      labels:
        app: complete-web
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: complete-web-service
  namespace: service-lab
spec:
  type: NodePort
  selector:
    app: complete-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090

