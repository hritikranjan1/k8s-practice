apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab40-mysql
  namespace: pv-pvc-final

spec:
  replicas: 1

  selector:
    matchLabels:
      app: lab40-mysql

  template:
    metadata:
      labels:
        app: lab40-mysql

    spec:
      containers:
        - name: mysql
          image: mysql:8.0

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpass

            - name: MYSQL_DATABASE
              value: devops_final

          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: lab40-mysql-pvc
